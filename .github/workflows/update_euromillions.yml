name: mise à jour-csv

on:
  schedule:
    # Tirages : mardi et vendredi vers 21 h (Paris). Plusieurs passages le soir
    # (heure d'été et d'hiver) + un rattrapage le lendemain matin.
    - cron: "30 19,20,21,22 * * 2,5"
    - cron: "0 7 * * 3,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-csv
  cancel-in-progress: false

jobs:
  mise-a-jour-csv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Mettre à jour le CSV
        run: python update_csv.py

      - name: Enregistrer si le fichier a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add euromillions_merged.csv
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
          else
            git commit -m "Mise à jour automatique des tirages"
            git push
          fi
